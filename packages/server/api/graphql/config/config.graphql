extend type Query {
  config(id: ID!): Config!
  oldConfig: String!
  # iplaces: checks the current group's DataCite settings (group-id header)
  dataciteConnectionCheck: DataciteConnectionCheck!
}

extend type Mutation {
  updateConfig(id: ID!, input: ConfigInput): Config!
}

type Config {
  id: ID!
  created: DateTime!
  updated: DateTime
  formData: String!
  active: Boolean!
  logo: File
  icon: File
  groupId: ID!
  flaxSiteUrl: String
  translationOverrides: String
}

input ConfigInput {
  formData: String!
  active: Boolean!
}

# iplaces: result of dataciteConnectionCheck. mode is 'test' or 'real'.
type DataciteConnectionCheck {
  ok: Boolean!
  mode: String!
  server: String!
  message: String!
}
