app = 'iplaces-test-client'
primary_region = 'lhr'

[build]
  image = 'cokoapps/kotahi-client:2026.04.27-0'

[env]
  CLIENT_PORT = '4000'
  SERVER_URL = 'https://iplaces-test-server.fly.dev'
  YJS_WEBSOCKET_SERVER_URL = 'wss://iplaces-test-server.fly.dev:8081'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
