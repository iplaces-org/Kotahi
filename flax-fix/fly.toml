# fly.toml app configuration file generated for iplaces-test-flax on 2026-10-19T12:56:19-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# iPlaces: this is the ONLY config to deploy iplaces-test-flax with. Deploy it
# through scripts/deploy-iplaces-flax.sh, which refuses to run if the [mounts]
# block below is missing. Without that block a deploy wipes every station site
# (2026-10-19 outage). Built sites live on the flax_public volume
# (vol_vlyql1lq3950o5o4, lhr), mounted at /app/public.

app = 'iplaces-test-flax'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  FLAX_CLIENT_API_URL = 'https://iplaces-test-server.fly.dev'
  FLAX_EXPRESS_PORT = '8081'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8081
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.ports]]
    port = 8081
    handlers = ['tls', 'http']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "flax_public"
  destination = "/app/public"
